<div class="crear-funcion-container" style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Programar Nueva Función</h2>
  <p>Al programar la función, se generarán automáticamente las butacas en la base de datos.</p>

  <div style="margin-bottom: 15px;">
    <label>Seleccionar Película:</label>
    <select [(ngModel)]="peliculaId" style="width: 100%; padding: 8px;">
      <option [ngValue]="null" disabled>-- Elige una película --</option>
      @for (pelicula of listaPeliculas; track pelicula.id) {
        <option [value]="pelicula.id">{{ pelicula.nombre || pelicula.nombre }}</option>
      }
    </select>
  </div>

  <div style="margin-bottom: 15px;">
    <label>ID de Sala:</label>
    <input type="number" [(ngModel)]="salaId" style="width: 100%; padding: 8px;" />
  </div>

  <div style="margin-bottom: 15px;">
    <label>Horario de Inicio:</label>
    <input type="text" [(ngModel)]="horarioInicio" placeholder="Ej: 15:00" style="width: 100%; padding: 8px;" />
  </div>

  <div style="margin-bottom: 15px;">
    <label>Horario de Fin:</label>
    <input type="text" [(ngModel)]="horarioFin" placeholder="Ej: 17:00" style="width: 100%; padding: 8px;" />
  </div>

  <button (click)="programarFuncion()" [disabled]="cargando" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
    {{ cargando ? 'Generando butacas...' : 'Crear Función y Butacas' }}
  </button>

  @if (mensajeResultado) {
    <p style="margin-top: 15px; font-weight: bold; color: green;">{{ mensajeResultado }}</p>
  }
</div>
