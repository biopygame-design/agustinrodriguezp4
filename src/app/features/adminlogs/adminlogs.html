<div class="p-6 max-w-6xl mx-auto">
  <h2 class="text-2xl font-bold mb-4 text-white">📋 Registro de Actividad (Auditoría)</h2>

  <div *ngIf="cargando()" class="text-gray-400">Cargando registros...</div>

  <div *ngIf="!cargando() && logs().length === 0" class="text-gray-400">
    No hay registros de actividad todavía.
  </div>

  <div class="overflow-x-auto" *ngIf="logs().length > 0">
    <table class="w-full text-left border-collapse bg-gray-900 text-gray-200 rounded-lg overflow-hidden shadow-lg">
      <thead>
        <tr class="bg-gray-800 text-gray-300 border-b border-gray-700">
          <th class="p-3">Fecha y Hora</th>
          <th class="p-3">Administrador</th>
          <th class="p-3">Acción</th>
          <th class="p-3">Detalles</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs()" class="border-b border-gray-800 hover:bg-gray-800/50">
          <td class="p-3 text-sm text-gray-400">{{ log.created_at | date:'medium' }}</td>
          <td class="p-3 font-semibold text-amber-400">{{ log.admin_email }}</td>
          <td class="p-3">
            <span class="px-2 py-1 bg-blue-900/60 text-blue-300 rounded text-xs font-medium">
              {{ log.accion }}
            </span>
          </td>
          <td class="p-3 text-sm text-gray-300">{{ log.detalles }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
