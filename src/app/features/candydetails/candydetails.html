@if (candy(); as item) {
  <div class="detail-container">
    <img [src]="item.imagen" [alt]="item.nombre" />
    <div class="info">
      <h2>{{ item.nombre | uppercase }}</h2>
      <p class="precio">Precio: ${{ item.precio }}</p>
      <button (click)="agregarAlCarrito()">Comprar / Agregar al Carrito</button>
    </div>
  </div>
} @else {
  <p>Cargando producto o no encontrado...</p>
}
